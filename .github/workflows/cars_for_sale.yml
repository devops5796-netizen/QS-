name: Cars For Sale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  detect_pages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Detect pages
        id: build_matrix
        run: |
          python << 'EOF'
          import requests
          import json
          import math
          import os

          URL = "https://production-api.qatarsale.com/api/v2/Products"

          payload = {
              "url": "/ar/products/cars_for_sale?basic_search:StatusFilter=0",
              "includeFavs": False,
              "pageSize": 36
          }

          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://qatarsale.com/",
              "Origin": "https://qatarsale.com",
          }

          response = requests.post(URL, json=payload, headers=headers, timeout=30)

          if response.status_code == 200:
              data = response.json()
              print(f"✅ pagesCount: {data['pagesCount']}")
              print(f"✅ totalCount: {data['totalCount']}")
          else:
              print(f"❌ Failed")
              print(f"Headers: {dict(response.headers)}")
              print(f"Body (first 1000 chars): {response.text[:1000]}")

          last_page = data['pagesCount']
          
          N_JOBS = 30

          pages_per_job = math.ceil(last_page / N_JOBS)

          matrix = {"include": []}

          for i in range(N_JOBS):
              start = i * pages_per_job + 1
              end = min((i + 1) * pages_per_job, last_page)
              if start > last_page:
                  break
              matrix["include"].append({
                  "start": start,
                  "end": end
              })

          print(json.dumps(matrix, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}")
          EOF

  scrape:
    needs: detect_pages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Run scraper
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          export PYTHONPATH=$PWD
          python -u Cars_for_sale/main.py ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.start }}-${{ matrix.end }}
          path: |
            all_products_flat_${{ matrix.start }}_${{ matrix.end }}.csv
            all_products_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json

  merge:
    runs-on: ubuntu-latest
    needs: scrape
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas boto3 openpyxl

      # Get workflow start time from GitHub API (full workflow duration)
      - name: Get workflow start time
        id: workflow_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT (timestamp: $START_TIMESTAMP)"

      - name: Download all CSV artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: csv-*
          merge-multiple: true
          path: csv_parts/

      - name: Merge and upload
        id: merge
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_START_TIME: ${{ steps.workflow_start.outputs.start_time }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, json, time
          from datetime import datetime, timezone, timedelta
          from Common_files.monitor_helpers import collect_failed_links

          # Get full workflow duration from GitHub API
          workflow_start_time = os.getenv("WORKFLOW_START_TIME")
          workflow_duration = None
          if workflow_start_time:
              try:
                  start_ts = float(workflow_start_time)
                  now_ts = time.time()
                  workflow_duration = round(now_ts - start_ts, 2)
                  print(f"✅ Full workflow duration: {workflow_duration}s")
              except (ValueError, TypeError):
                  print("⚠️ Warning: Could not parse WORKFLOW_START_TIME")

          # Data date = yesterday
          data_date = datetime.now(timezone.utc)
          dt = datetime.now(timezone.utc)

          files = glob.glob('csv_parts/*.csv')
          if not files:
              print("No CSV files for yesterday across any job -- nothing to merge or upload.")
              with open("HAS_DATA", "w") as f:
                  f.write("false")
              exit(0)

          dfs = [pd.read_csv(f) for f in files]
          merged = pd.concat(dfs, ignore_index=True)
          merged = merged.drop_duplicates(subset=['product_url'], keep='first')

          merged.to_excel('cars_for_sale.xlsx', index=False)

          json_file = "cars_for_sale.json"
          json_data = merged.to_dict(orient='records')
          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(json_data, f, ensure_ascii=False, indent=2)
          print(f"JSON saved: {json_file} ({len(json_data)} records)")

          print(f'Found {len(files)} CSV files to merge')
          print(f'Total Rows: {len(merged)}')

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']
          
          # Use data_date for path (yesterday)
          base = f"qatarsale/year={data_date.year}/month={data_date.strftime('%m')}/day={data_date.strftime('%d')}/cars_for_sale"

          # Build complete summary (includes failed + metrics)
          failed_links = collect_failed_links('csv_parts/*_failed.txt')
          total_failed = len(failed_links)
          
          # Read request stats
          stats_files = glob.glob('csv_parts/request_stats_*.json')
          total_requests = 0
          requests_duration_sec = 0.0
          per_source = {}
          
          for sf in stats_files:
              with open(sf, 'r', encoding='utf-8') as f:
                  stats = json.load(f)
              total_requests += stats.get('total_requests', 0)
              duration_min = stats.get('total_duration_min', 0)
              if duration_min:
                  requests_duration_sec = max(requests_duration_sec, duration_min * 60)
              for source, count in stats.get('per_source', {}).items():
                  per_source[source] = per_source.get(source, 0) + count
          
          error_rate_pct = round(total_failed / total_requests * 100, 2) if total_requests > 0 else None
          requests_per_min = round(total_requests / (requests_duration_sec / 60.0), 2) if requests_duration_sec > 0 else None

          failed_items = []
          for url in failed_links:
              failed_items.append({
                  "name": url,
                  "errors": 1,
                  "detail": "Failed to scrape"
              })

          # Build subcategories
          subcategories = []
          if "specs_Make" in merged.columns:
              for make in merged["specs_Make"].dropna().unique():
                  count = len(merged[merged["specs_Make"] == make])
                  subcategories.append({
                      "name_ar": "",
                      "name_en": str(make),
                      "slug": str(make),
                      "listings_count": count,
                      "has_subcategories": False,
                      "subcategories": []
                  })

          # Complete summary with all metrics
          summary = {
              "scraped_at": dt.isoformat(),
              "data_scraped_date": (datetime.now() - timedelta(days=1)).strftime("%Y-%m-%d"),
              "saved_to_R2_date": data_date.strftime("%Y-%m-%d"),
              "category": {
                  "name_ar": "سيارات للبيع",
                  "name_en": "Cars for Sale",
                  "slug": "cars_for_sale"
              },
              "workflow_name": "cars_for_sale",
              "total_subcategories": len(subcategories),
              "total_listings": len(merged),
              "subcategories": subcategories,
              "request_metrics": {
                  "requests_total": total_requests,
                  "requests_failed": total_failed,
                  "error_rate_pct": error_rate_pct,
                  "duration_sec": workflow_duration,
                  "requests_duration_sec": requests_duration_sec,
                  "requests_per_min": requests_per_min,
                  "per_source": per_source
              },
              "failed_items": failed_items,
              "failed_items_summary": "; ".join([f"{f['name']}: 1 error" for f in failed_items[:5]]) if failed_items else None
          }

          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(f"Summary saved: summary.json ({summary['total_subcategories']} subcats, {summary['total_listings']} listings)")

          # Upload summary.json only
          summary_key = f"{base}/summary/summary.json"
          client.upload_file("summary.json", bucket, summary_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Summary uploaded: {summary_key}")
          print(f"  - {summary['total_subcategories']} subcats, {summary['total_listings']} listings")
          print(f"  - requests: {summary['request_metrics']['requests_total']} total, {summary['request_metrics']['requests_failed']} failed")
          print(f"  - duration: {summary['request_metrics']['duration_sec']}s")
          print(f"  - RPM: {summary['request_metrics']['requests_per_min']}")

          with open("HAS_DATA", "w") as f:
              f.write("true")
          EOF

          if [ -f HAS_DATA ] && grep -q "true" HAS_DATA; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split by manufacturer
        if: steps.merge.outputs.has_data == 'true'
        run: |
          pip install openpyxl
          python Common_files/split_by_manufacturer.py cars_for_sale.xlsx excel_by_manufacturer

      - name: Upload Excel files to R2
        if: steps.merge.outputs.has_data == 'true'
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import boto3, os, glob, json
          from datetime import datetime, timedelta, timezone
          import pandas as pd

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          
          # Use data date (yesterday) for path
          data_date = datetime.now(timezone.utc)
          prefix = f"qatarsale/year={data_date.year}/month={data_date.strftime('%m')}/day={data_date.strftime('%d')}/cars_for_sale/excel"
          bucket = os.environ['CF_R2_BUCKET_NAME']

          for f in glob.glob('excel_by_manufacturer/*.xlsx'):
              key = f"{prefix}/{os.path.basename(f)}"
              client.upload_file(f, bucket, key,
                  ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f"Uploaded: {key}")

              df_split = pd.read_excel(f)
              json_split_file = f"{os.path.splitext(f)[0]}.json"
              with open(json_split_file, 'w', encoding='utf-8') as jf:
                  json.dump(df_split.to_dict(orient='records'), jf, ensure_ascii=False, indent=2)
                  
              json_prefix = f"qatarsale/year={data_date.year}/month={data_date.strftime('%m')}/day={data_date.strftime('%d')}/cars_for_sale/json"
              json_key = f"{json_prefix}/{os.path.basename(json_split_file)}"
              client.upload_file(json_split_file, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"Uploaded JSON: {json_key}")
          EOF