name: Jobs

on:
  workflow_run:
    workflows: ["Cars For Sale"]
    types:
      - completed
  workflow_dispatch:

jobs:
  scrape_jobs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt
          
      - name: Run scraper
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          export PYTHONPATH=$PWD
          python -u Jobs/jobs_scraper.py

      - uses: actions/upload-artifact@v4
        with:
          name: jobs-excel-all
          path: |
            jobs_*.xlsx
            failed_urls*.txt
            jobs_*_request_stats.json
          if-no-files-found: ignore

  merge_jobs:
    runs-on: ubuntu-latest
    needs: scrape_jobs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3

      # Get workflow start time from GitHub API (full workflow duration)
      - name: Get workflow start time
        id: workflow_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT (timestamp: $START_TIMESTAMP)"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jobs-excel-*
          merge-multiple: true
          path: excel_parts/

      - name: Merge and upload to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_START_TIME: ${{ steps.workflow_start.outputs.start_time }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, time, json
          from datetime import datetime, timezone, timedelta
          from Common_files.monitor_helpers import collect_failed_links

          # Get full workflow duration from GitHub API
          workflow_start_time = os.getenv("WORKFLOW_START_TIME")
          workflow_duration = None
          if workflow_start_time:
              try:
                  start_ts = float(workflow_start_time)
                  now_ts = time.time()
                  workflow_duration = round(now_ts - start_ts, 2)
                  print(f"✅ Full workflow duration: {workflow_duration}s")
              except (ValueError, TypeError):
                  print("⚠️ Warning: Could not parse WORKFLOW_START_TIME")

          # Data date = yesterday
          data_date = datetime.now(timezone.utc)
          dt = datetime.now(timezone.utc)

          base = f"qatarsale/year={data_date.year}/month={data_date.strftime('%m')}/day={data_date.strftime('%d')}/jobs"
          bucket = os.environ['CF_R2_BUCKET_NAME']

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )

          files = glob.glob('excel_parts/*.xlsx')
          if not files:
              print("No Excel files found -- nothing scraped for yesterday, skipping all uploads.")
              exit(0)

          dfs = [pd.read_excel(f) for f in files]
          merged = pd.concat(dfs, ignore_index=True)
          merged = merged.drop_duplicates(subset=['job_url'], keep='first')
          total = len(merged)
          print(f"Merged {len(files)} files | {total} total jobs")

          if total == 0:
              print("Merged result is empty -- skipping all uploads.")
              exit(0)

          json_file = "jobs.json"
          json_data = merged.to_dict(orient='records')
          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(json_data, f, ensure_ascii=False, indent=2)
          print(f"JSON saved: {json_file} ({len(json_data)} records)")

          output_file = "jobs.xlsx"
          merged.to_excel(output_file, index=False, sheet_name="jobs")

          key = f"{base}/excel/jobs.xlsx"
          client.upload_file(output_file, bucket, key,
              ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
          print(f"Uploaded: {key}")

          key_j = f"{base}/json/jobs.json"
          client.upload_file("jobs.json", bucket, key_j,
              ExtraArgs={"ContentType": "application/json; charset=utf-8"})
          print(f"Uploaded: {key_j}")

          # Build complete summary
          failed_links = collect_failed_links('excel_parts/failed_urls*.txt')
          total_failed = len(failed_links)

          stats_files = glob.glob('excel_parts/*_request_stats.json')
          total_requests = 0
          requests_duration_sec = 0.0
          per_source = {}

          for sf in stats_files:
              with open(sf, 'r', encoding='utf-8') as f:
                  stats = json.load(f)
              total_requests += stats.get('total_requests', 0)
              duration_min = stats.get('total_duration_min', 0)
              if duration_min:
                  requests_duration_sec = max(requests_duration_sec, duration_min * 60)
              for source, count in stats.get('per_source', {}).items():
                  per_source[source] = per_source.get(source, 0) + count

          error_rate_pct = round(total_failed / total_requests * 100, 2) if total_requests > 0 else None
          requests_per_min = round(total_requests / (requests_duration_sec / 60.0), 2) if requests_duration_sec > 0 else None

          failed_items = []
          for url in failed_links:
              failed_items.append({
                  "name": url,
                  "errors": 1,
                  "detail": "Failed to scrape"
              })

          summary = {
              "scraped_at": dt.isoformat(),
              "data_scraped_date": (datetime.now() - timedelta(days=1)).strftime("%Y-%m-%d"),
              "saved_to_R2_date": data_date.strftime("%Y-%m-%d"),
              "category": {
                  "name_ar": "وظائف",
                  "name_en": "Jobs",
                  "slug": "jobs"
              },
              "workflow_name": "jobs",
              "total_subcategories": 0,
              "total_listings": total,
              "subcategories": [],
              "request_metrics": {
                  "requests_total": total_requests,
                  "requests_failed": total_failed,
                  "error_rate_pct": error_rate_pct,
                  "duration_sec": workflow_duration,
                  "requests_duration_sec": requests_duration_sec,
                  "requests_per_min": requests_per_min,
                  "per_source": per_source
              },
              "failed_items": failed_items,
              "failed_items_summary": "; ".join([f"{f['name']}: 1 error" for f in failed_items[:5]]) if failed_items else None
          }

          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)

          key = f"{base}/summary/summary.json"
          client.upload_file("summary.json", bucket, key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Uploaded: {key}")
          print(f"  - {summary['total_subcategories']} subcats, {summary['total_listings']} listings")
          print(f"  - requests: {summary['request_metrics']['requests_total']} total, {summary['request_metrics']['requests_failed']} failed")
          print(f"  - duration: {summary['request_metrics']['duration_sec']}s")
          print(f"  - RPM: {summary['request_metrics']['requests_per_min']}")

          EOF