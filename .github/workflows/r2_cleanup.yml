name: QatarSale R2 Cleanup

# Manual trigger only — you choose dry-run and (optionally) a single date
# each time you run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = just print what would change, false = actually delete/modify)"
        required: true
        type: boolean
        default: true
      date:
        description: "Optional single date, e.g. year=2026/month=09/day=01/  (leave empty = ALL dates)"
        required: false
        type: string
        default: ""

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 openpyxl

      - name: Run cleanup script
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          echo "Running: python r2_cleanup_images.py $ARGS"
          python r2_cleanup_images.py $ARGS