name: Sub Categories

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  detect_pages:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Detect pages and build matrix
        id: build_matrix
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python << 'EOF'
          import json
          import os
          from Common_files.detect_utils import analyze_category_with_products

          MULTI_CATEGORIES = {
                "car_spare_parts_accessories-automotive_exterior_accessories":
                    "https://qatarsale.com/ar/products/car_spare_parts_accessories-automotive_exterior_accessories?basic_search:StatusFilter=0",
                "heavy_equipments":
                    "https://qatarsale.com/ar/products/heavy_equipments?basic_search:StatusFilter=0",
                "car_spare_parts_accessories":
                    "https://qatarsale.com/ar/products/car_spare_parts_accessories?basic_search:StatusFilter=0",
                "jewellery":
                    "https://qatarsale.com/ar/products/jewellery?basic_search:StatusFilter=0",
                "property":
                    "https://qatarsale.com/ar/products/property?basic_search:StatusFilter=0",
                "watercrafts":
                    "https://qatarsale.com/ar/products/watercrafts?basic_search:StatusFilter=0",
                "computers_and_parts":
                    "https://qatarsale.com/ar/products/computers_and_parts?basic_search:StatusFilter=0",
                "video_games":
                    "https://qatarsale.com/ar/products/video_games?basic_search:StatusFilter=0",
                "wrist_watches":
                    "https://qatarsale.com/ar/products/wrist_watches?basic_search:StatusFilter=0",
                "home_security_surveillance_systems":
                    "https://qatarsale.com/ar/products/home_security_surveillance_systems?basic_search:StatusFilter=0",
                "health_beauty":
                    "https://qatarsale.com/ar/products/health_beauty?basic_search:StatusFilter=0",
                "toys_games":
                    "https://qatarsale.com/ar/products/toys_games?basic_search:StatusFilter=0",
                "kids":
                    "https://qatarsale.com/ar/products/kids?basic_search:StatusFilter=0",
                "shoes_bags":
                    "https://qatarsale.com/ar/products/shoes_bags?basic_search:StatusFilter=0",
                "arts_crafts_sewing":
                    "https://qatarsale.com/ar/products/arts_crafts_sewing?basic_search:StatusFilter=0",
                "kitchen_dining_room":
                    "https://qatarsale.com/ar/products/kitchen_dining_room?basic_search:StatusFilter=0",
                "education":
                    "https://qatarsale.com/ar/products/education?basic_search:StatusFilter=0",
                "bikes_accessories":
                    "https://qatarsale.com/ar/products/bikes_accessories?basic_search:StatusFilter=0",
                "clothes":
                    "https://qatarsale.com/ar/products/clothes?basic_search:StatusFilter=0",
                "camping":
                    "https://qatarsale.com/ar/products/camping?basic_search:StatusFilter=0",
                "tools_home_improvement":
                    "https://qatarsale.com/ar/products/tools_home_improvement?basic_search:StatusFilter=0",
                "men_accessories":
                    "https://qatarsale.com/ar/products/men_accessories?basic_search:StatusFilter=0",
                "musical_instruments":
                      "https://qatarsale.com/ar/products/musical_instruments?basic_search:StatusFilter=0",
                "travel_accessories":
                      "https://qatarsale.com/ar/products/travel_accessories?basic_search:StatusFilter=0",
                "special_numbers":
                      "https://qatarsale.com/ar/products/special_numbers?basic_search:StatusFilter=0",
          }

          PAGES_PER_JOB = {cat: 20 for cat in MULTI_CATEGORIES}

          matrix = {"include": []}

          for category, url in MULTI_CATEGORIES.items():
              print(f"Detecting pages for {category}...")
              try:
                  last_page, has_products = analyze_category_with_products(url)
              except Exception as e:
                  print(f"  Failed: {e}")
                  continue

              if not has_products:
                  print(f"  ⚠️ No products in {category}, skipping...")
                  continue

              print(f"  {category}: {last_page} pages")

              category_path = url.replace("https://qatarsale.com", "")
              pages_per_job = PAGES_PER_JOB.get(category, 20)

              for i in range(0, last_page, pages_per_job):
                  start = i + 1
                  end   = min(i + pages_per_job, last_page)
                  matrix["include"].append({
                      "category":      category,
                      "category_path": category_path,
                      "start":         start,
                      "end":           end,
                  })

          print(f"Total jobs: {len(matrix['include'])}")
          print(f"Matrix: {json.dumps(matrix, indent=2, ensure_ascii=False)}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
          EOF

  scrape_subcats:
    runs-on: ubuntu-latest
    needs: detect_pages
    strategy:
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Run scraper for category pages
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          export PYTHONPATH=$PWD
          python -u Sub_and_Sub_Sub_Categories/main.py \
            "${{ matrix.category }}" \
            "${{ matrix.category_path }}" \
            ${{ matrix.start }} \
            ${{ matrix.end }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-excel-${{ matrix.category }}-${{ matrix.start }}-${{ matrix.end }}
          path: |
            *.xlsx
            products_${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore
      
  merge_subcats:
    runs-on: ubuntu-latest
    needs: scrape_subcats

    strategy:
      matrix:
        category:
          - car_spare_parts_accessories-automotive_exterior_accessories
          - heavy_equipments
          - car_spare_parts_accessories
          - jewellery
          - property
          - watercrafts
          - computers_and_parts
          - video_games
          - wrist_watches
          - home_security_surveillance_systems
          - health_beauty
          - toys_games
          - kids
          - shoes_bags
          - arts_crafts_sewing
          - kitchen_dining_room
          - education
          - bikes_accessories
          - clothes
          - camping
          - tools_home_improvement
          - men_accessories
          - musical_instruments
          - travel_accessories
          - special_numbers

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      # Get workflow start time from GitHub API (full workflow duration)
      - name: Get workflow start time
        id: workflow_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT (timestamp: $START_TIMESTAMP)"

      - name: Download artifacts for ${{ matrix.category }}
        uses: actions/download-artifact@v4
        with:
          pattern: multi-excel-${{ matrix.category }}-*
          merge-multiple: true
          path: excel_parts/      

      - name: Merge sheets and upload
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_START_TIME: ${{ steps.workflow_start.outputs.start_time }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, json, time
          from datetime import datetime, timezone, timedelta
          from Common_files.r2_uploader import upload_final_batch_assets
          from Common_files.monitor_helpers import collect_failed_links

          category = "${{ matrix.category }}"
          
          # Get full workflow duration from GitHub API
          workflow_start_time = os.getenv("WORKFLOW_START_TIME")
          workflow_duration = None
          if workflow_start_time:
              try:
                  start_ts = float(workflow_start_time)
                  now_ts = time.time()
                  workflow_duration = round(now_ts - start_ts, 2)
                  print(f"✅ Full workflow duration: {workflow_duration}s")
              except (ValueError, TypeError):
                  print("⚠️ Warning: Could not parse WORKFLOW_START_TIME")

          # Data date = yesterday
          data_date = datetime.now(timezone.utc)
          dt = datetime.now(timezone.utc)

          files = glob.glob('excel_parts/*.xlsx')

          if not files:
              print(f"No Excel files found for {category} -- nothing scraped for yesterday, skipping all uploads.")
              exit(0)

          by_filename: dict[str, dict[str, pd.DataFrame]] = {}
          for f in files:
              fname = os.path.basename(f)
              xl = pd.ExcelFile(f)
              sheets = by_filename.setdefault(fname, {})
              for sheet in xl.sheet_names:
                  df = xl.parse(sheet)
                  if sheet in sheets:
                      sheets[sheet] = pd.concat([sheets[sheet], df], ignore_index=True)
                  else:
                      sheets[sheet] = df

          for fname, sheets in by_filename.items():
              for sheet in sheets:
                  if 'product_url' in sheets[sheet].columns:
                      sheets[sheet] = sheets[sheet].drop_duplicates(subset=['product_url'], keep='first')

          all_dfs = []
          for fname, sheets in by_filename.items():
              all_dfs.extend(sheets.values())
          combined_df = pd.concat(all_dfs, ignore_index=True) if all_dfs else pd.DataFrame()

          if combined_df.empty:
              print(f"Merged result is empty for {category} -- skipping all uploads.")
              exit(0)

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']
          
          # Use data_date for path (yesterday)
          base_key = f"qatarsale/year={data_date.year}/month={data_date.strftime('%m')}/day={data_date.strftime('%d')}/{category}"

          all_data = []
          for fname, sheets in by_filename.items():
              local_path = fname
              with pd.ExcelWriter(local_path, engine="openpyxl") as writer:
                  for sheet_name, df in sheets.items():
                      safe = sheet_name.replace("/", "-").replace("\\", "-").replace("*", "").replace("?", "").replace(":", "-")
                      df.to_excel(writer, sheet_name=safe, index=False)
                      print(f"  [{fname}] Sheet '{safe}': {len(df)} rows")

              excel_key = f"{base_key}/excel/{fname}"
              client.upload_file(local_path, bucket, excel_key,
                  ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f"Excel uploaded: {excel_key}")

              json_fname = fname.replace(".xlsx", ".json")
              file_records = []
              for sheet_name, df in sheets.items():
                  recs = df.to_dict(orient='records')
                  for r in recs:
                      r["_sheet"] = sheet_name
                  file_records.extend(recs)
                  all_data.extend(recs)

              with open(json_fname, 'w', encoding='utf-8') as f:
                  json.dump(file_records, f, ensure_ascii=False, indent=2)

              json_key = f"{base_key}/json/{json_fname}"
              client.upload_file(json_fname, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"JSON uploaded: {json_key}")

          # Build complete summary
          failed_links = collect_failed_links('excel_parts/*_failed.txt')
          total_failed = len(failed_links)

          stats_files = glob.glob('excel_parts/request_stats_*.json')
          total_requests = 0
          requests_duration_sec = 0.0
          per_source = {}

          for sf in stats_files:
              with open(sf, 'r', encoding='utf-8') as f:
                  stats = json.load(f)
              total_requests += stats.get('total_requests', 0)
              duration_min = stats.get('total_duration_min', 0)
              if duration_min:
                  requests_duration_sec = max(requests_duration_sec, duration_min * 60)
              for source, count in stats.get('per_source', {}).items():
                  per_source[source] = per_source.get(source, 0) + count

          error_rate_pct = round(total_failed / total_requests * 100, 2) if total_requests > 0 else None
          requests_per_min = round(total_requests / (requests_duration_sec / 60.0), 2) if requests_duration_sec > 0 else None

          failed_items = []
          for url in failed_links:
              failed_items.append({
                  "name": url,
                  "errors": 1,
                  "detail": "Failed to scrape"
              })

          summary = {
              "scraped_at": dt.isoformat(),
              "data_scraped_date": (datetime.now() - timedelta(days=1)).strftime("%Y-%m-%d"),
              "saved_to_R2_date": data_date.strftime("%Y-%m-%d"),
              "category": {
                  "name_ar": "",
                  "name_en": category,
                  "slug": category
              },
              "workflow_name": "sub_categories",
              "total_subcategories": len(combined_df['specs_Class'].unique()) if 'specs_Class' in combined_df.columns else 0,
              "total_listings": len(combined_df),
              "subcategories": [],
              "request_metrics": {
                  "requests_total": total_requests,
                  "requests_failed": total_failed,
                  "error_rate_pct": error_rate_pct,
                  "duration_sec": workflow_duration,
                  "requests_duration_sec": requests_duration_sec,
                  "requests_per_min": requests_per_min,
                  "per_source": per_source
              },
              "failed_items": failed_items,
              "failed_items_summary": "; ".join([f"{f['name']}: 1 error" for f in failed_items[:5]]) if failed_items else None
          }

          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(f"Summary saved: summary.json ({summary['total_subcategories']} subcats, {summary['total_listings']} listings)")

          summary_key = f"{base_key}/summary/summary.json"
          client.upload_file("summary.json", bucket, summary_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Summary uploaded: {summary_key}")
          print(f"  - {summary['total_subcategories']} subcats, {summary['total_listings']} listings")
          print(f"  - requests: {summary['request_metrics']['requests_total']} total, {summary['request_metrics']['requests_failed']} failed")
          print(f"  - duration: {summary['request_metrics']['duration_sec']}s")
          print(f"  - RPM: {summary['request_metrics']['requests_per_min']}")

          EOF