# ── PER-SCRAPER SCHEMAS ──────────────────────────────────────
excel_schema:

  # ── BATCH Cars For Sale ─────────────────────────────────────────────────

  - scraper: cars_for_sale
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_sale_cars_listing
        optional_columns:
          - oldPrice
          - soldDate
