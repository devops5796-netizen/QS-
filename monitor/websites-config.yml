# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch Cars For Sale → Jobs → Users → Simple Categories → Sub Categories → 
#       Sub Sub Categories → Showrooms(daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "Cars For Sale"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Jobs"
  - batch: "Jobs"
    trigger: "on_completion: Cars For Sale"
    triggers_next: "Users"
  - batch: "Users"
    trigger: "on_completion: Jobs"
    triggers_next: "Simple Categories"
  - batch: "Simple Categories"
    trigger: "on_completion: Users"
    triggers_next: "Sub Categories"
  - batch: "Sub Categories"
    trigger: "on_completion: Simple Categories"
    triggers_next: "Sub Sub Categories"
  - batch: "Sub Sub Categories"
    trigger: "on_completion: Sub Categories"
    triggers_next: "Showrooms"
  - batch: "Showrooms"
    trigger: "workflow_dispatch (triggered by Sub Sub Categories)"
    triggers_next: null

