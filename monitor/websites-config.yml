# ============================================================
# ALERT THRESHS — schema validation + historical trend alarms
# Trend multipliers calibrated against monitor_stats.yml
# (observed 2026-06-07 → 2026-06-13, 7 days, 23 scrapers)
# ============================================================
alert_thresholds:
  enabled: true

  # Fire webhook when ANY scraper fails schema / trend / missing-files check
  alert_on_any_failure: true
  # To re-enable "No Excel files" alerts later,
  # just flip this to false in the YAML — no code changes needed.
  skip_no_files_alert: true

  # Historical trend checks (requires monitor_stats.yml in R2)
  trend:
    min_observed_days: 7
    min_row_pct_of_hist_min: 5       # alert if rows < 5% of historical min
    max_row_pct_of_hist_max: 1000    # alert if rows > 1000% of historical max
    min_file_size_pct_of_hist_min: 10 # alert if file < 10% of historical min
  
